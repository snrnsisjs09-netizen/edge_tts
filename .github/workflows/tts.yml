name: Generate narration (edge-tts)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder (contains scenes.json)"
        default: "day3"
  push:
    paths:
      - "*/scenes.json"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.3.1 mutagen==1.48.1
      - name: Synthesize
        run: python tts.py "${{ github.event.inputs.project || 'day3' }}"
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate narration audio"
          git push
